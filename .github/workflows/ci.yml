name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Placeholders. The build must not need real credentials, and the secret
      # scan uses this canary value to prove it can detect a leak — if this
      # string ever appears in a client asset, the scan fails the build.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-anon-placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-canary-1f4b9d0c7a2e

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Includes the RLS suite, which migrates a real PostgreSQL instance
      # (PGlite) and exercises the policies under the `authenticated` role.
      # No external database service is required.
      - name: Tests — including RLS coverage guard and tenant isolation
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Client bundle secret scan
        run: pnpm scan:secrets
